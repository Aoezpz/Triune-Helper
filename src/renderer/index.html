<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Triune-Helper</title>
    <!-- No remote origins: everything the app renders is bundled or comes over
         IPC. img-src allows data: for canvas snapshots and inline crests. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data: file:; connect-src 'self'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
